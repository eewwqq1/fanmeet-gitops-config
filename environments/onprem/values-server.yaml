# Fanmeet monolith (app-source/server). Largest of the 4 deployment units — everything else
# is a values override, the chart template never branches on which service this is.
image:
  # Registry container on a dedicated Ubuntu VM (docker1/"manager", formerly an unused kubeadm
  # test node, repurposed 2026-08-14), reachable from the on-prem cluster's VMnet8 network
  # (211.183.3.0/24). Moved off the Windows host to escape Windows' dynamic TCP port-exclusion
  # ranges (HNS-managed) intermittently colliding with the 5432/5433 port range — see log.md.
  repository: 211.183.3.100:5000/fanmeet-server
  tag: "53a627c"
  pullPolicy: IfNotPresent

port: 20100

# Actuator runs on a separate management port here (unlike the 3 extracted services) —
# see docs/superpowers/specs/2026-08-11-helm-chart-standardization.md for why.
healthCheckPort: 20101
healthCheckPath: /actuator/health

replicas: 2

resources:
  requests:
    cpu: 500m
    memory: 768Mi
  # No cpu limit — see values-membership-billing.yaml for why (JVM startup CFS throttling,
  # observed directly via jstack on this cluster). The monolith is the biggest JVM here, so
  # it's the most exposed to this if a limit were set.
  limits:
    memory: 1536Mi

env:
  # NOTE: "dev" not "prod" — this K8s deployment is the stage-1 verification milestone
  # (does the modernized app actually run on the on-prem cluster?), not a real prod cutover
  # (that's a much later master-plan stage). The prod profile uses different ports
  # (12400/12401) and different credentials than this chart assumes (20100/20101,
  # FANMEET_DEV) — using it here without also changing `port`/`healthCheckPort` above would
  # silently break. dev matches what's actually been built/tested all session.
  - name: SPRING_PROFILES_ACTIVE
    value: dev
  # management.server.address=127.0.0.1 in application-{dev,prod}.properties is a sane
  # local-dev default but unreachable by kubelet's HTTP probes (they hit the pod IP, not the
  # container's loopback interface) — override for any K8s deployment without touching the
  # properties files' local-dev security default.
  - name: MANAGEMENT_SERVER_ADDRESS
    value: "0.0.0.0"
  - name: SPRING_DATASOURCE_URL
    value: jdbc:postgresql://211.183.3.100:5432/FANMEET_DEV
  # Overrides the hardcoded `spring.datasource.password` value baked into
  # application-dev.properties (Spring env vars take precedence over bundled
  # properties files) — the rotated DB password lives only in this Secret now,
  # not in source. See log.md session 12 for the rotation record.
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: fanmeet-db-credentials
        key: password
  # application-common.properties defaults to spring.redis.host=localhost — unreachable from
  # inside the pod. Confirmed as a real crash (ConnectException: Connection refused
  # localhost/127.0.0.1:6379) during on-cluster verification.
  - name: SPRING_REDIS_HOST
    value: "211.183.3.100"

service:
  port: 80
  # Exposed via MetalLB (unlike the other 3 services, which stay ClusterIP-only) so a mobile
  # app running on an emulator/device outside the cluster can reach it for manual verification.
  # See docs/superpowers/specs/2026-08-11-helm-chart-standardization.md.
  type: LoadBalancer
