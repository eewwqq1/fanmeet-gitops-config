# AWS (EKS) override for notification-service (app-source/notification-service). Only
# infra-dependent values change from environments/onprem/values-notification.yaml — this
# service has no SPRING_DATASOURCE_* env in the on-prem file either (Redis only), so no RDS
# override is added here.
image:
  repository: "023179631876.dkr.ecr.ap-northeast-2.amazonaws.com/fanmeet-notification"
  tag: "cd74154"
  pullPolicy: IfNotPresent

port: 8082
healthCheckPath: /actuator/health

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# NOTE: not consumed by the chart yet — no PVC/volume template exists (none of the 4 on-prem
# values files use persistence either; these services are stateless). Kept per the plan's
# values contract as a harmless override in case persistence is added later.
persistence:
  storageClassName: gp3

env:
  # Redis still lives on docker1 (211.183.3.100) on the on-prem network — reachable from EKS
  # over the WireGuard tunnel established in Task 1-4.
  - name: SPRING_REDIS_HOST
    value: "211.183.3.100"

service:
  port: 80
