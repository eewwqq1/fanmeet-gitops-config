apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fanmeet-services
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - env: onprem
                  server: https://kubernetes.default.svc
                - env: aws
                  server: "https://FDB5CF176615265D0AFACAC7A5D91FDC.gr7.ap-northeast-2.eks.amazonaws.com"
          - list:
              elements:
                - service: server
                - service: media
                - service: notification
                - service: membership-billing
  template:
    metadata:
      name: "fanmeet-{{service}}-{{env}}"
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/eewwqq1/fanmeet-gitops-config.git
        targetRevision: main
        path: charts/service
        helm:
          releaseName: "fanmeet-{{service}}"
          valueFiles:
            - "../../environments/{{env}}/values-{{service}}.yaml"
      destination:
        server: "{{server}}"
        namespace: fanmeet
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
