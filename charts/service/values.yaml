# Default values — every field here is overridden by a per-service values-*.yaml file.
# See docs/superpowers/specs/2026-08-11-helm-chart-standardization.md for the design rationale.

image:
  repository: ""
  tag: local
  pullPolicy: IfNotPresent

# Port the container actually serves traffic on.
port: 8080

# Port the liveness/readiness probes hit. Leave empty to reuse `port` — only the monolith
# overrides this (it exposes actuator on a separate management port).
healthCheckPort: ""

# Path the liveness/readiness probes hit. Every Spring Boot service uses the actuator
# default; only media-server (Node/Express) overrides this.
healthCheckPath: /actuator/health

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  # No default cpu limit — Helm deep-merges values files, so a default here would silently
  # survive even when a values-*.yaml override tries to drop it (only setting it to null
  # actually unsets an inherited key). JVM startup is CPU-bursty (classloading + C2 JIT); a
  # tight cpu limit causes severe CFS throttling that turns a ~10s local boot into minutes —
  # observed directly via jstack on this cluster. memory limit stays — OOM-kill is correct
  # behavior for a real leak/runaway, unlike CPU throttling on a legitimate startup burst.
  limits:
    memory: 512Mi

# List of {name, value} pairs passed straight through as container env vars. Internal key
# names differ per service (Spring relaxed-binding vs. Node's plain process.env) — the chart
# doesn't care, it just forwards whatever's here.
env: []

service:
  port: 80

# Disabled by default (on-prem uses MetalLB LoadBalancer/ClusterIP Services, not Ingress) —
# only the aws environment turns this on to get an ALB provisioned by the AWS Load Balancer
# Controller (see environments/aws/values-*.yaml).
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
