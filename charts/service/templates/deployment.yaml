{{- $healthPort := .Values.healthCheckPort | default .Values.port -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  {{- with .Values.rollingUpdate }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .maxSurge }}
      maxUnavailable: {{ .maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "service.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "service.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
            {{- if ne $healthPort .Values.port }}
            - name: management
              containerPort: {{ $healthPort }}
            {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Slow-starting JVM apps (Spring context init) were getting killed by the liveness
          # probe before they'd even opened the port — startupProbe holds liveness/readiness
          # off until the app is actually up, with its own generous budget (up to 150s) for
          # that first boot. Once it succeeds once, liveness/readiness take over as normal.
          startupProbe:
            httpGet:
              path: {{ .Values.healthCheckPath }}
              port: {{ $healthPort }}
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheckPath }}
              port: {{ $healthPort }}
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheckPath }}
              port: {{ $healthPort }}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
