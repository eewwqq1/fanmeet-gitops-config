# notification-service (app-source/notification-service).
image:
  repository: fanmeet-notification-service
  tag: local
  pullPolicy: IfNotPresent

port: 8082

# Actuator health check added alongside this chart — see
# docs/superpowers/specs/2026-08-11-helm-chart-standardization.md item 2.
healthCheckPath: /actuator/health

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 300m
    memory: 512Mi

env:
  - name: SPRING_REDIS_HOST
    value: fanmeet-redis

service:
  port: 80
